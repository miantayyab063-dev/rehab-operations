<style>

const paths={bed:'M3 18V7m0 7h18m0 4v-7a3 3 0 0 0-3-3H9v6m-6-4h5',home:'m3 11 9-8 9 8v10H3zm6 10v-7h6v7',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-8 9v-1a8 6 0 0 1 16 0v1',shift:'M4 6h16v14H4zm4-3v6m8-6v6M4 10h16m-12 5 3 3 5-5',bill:'M5 3h14v18l-3-2-4 2-4-2-3 2zm4 6h6m-6 4h6',chat:'M4 4h16v12H10l-6 4zm4 5h8m-8 3h5',chart:'M4 4v16h16M8 16v-4m5 4V8m5 8V6',shield:'m12 3 8 4v6c0 4-4 7-8 8-4-1-8-4-8-8V7zm-3 9 2 2 4-4'};
const tones=['#234bd2','#683ac0','#a62d71','#087557'];
const ico=(k,i=0)=>`<span class="ico" aria-hidden="true" style="--tone:${tones[i%4]}"><svg viewBox="0 0 24 24"><path d="${paths[k]||paths.chart}"/></svg></span>`;
const nav=[['Overview','home'],['Admissions','user'],['Ward beds','bed'],['My shift','shift'],['Billing','bill'],['Follow-ups','chat'],['Screen library','shield']];
const tasks={Supervisor:['Review overdue handovers','Check missing stay charges','Assign follow-up owners'],Reception:['Return inquiry calls','Check available female ward beds','Complete intake drafts'],Nurse:['Review pending care tasks','Acknowledge incoming handover','Send unresolved items to next shift'],Clinician:['Review assigned chart','Sign eligible records','Approve discharge summary'],Finance:['Review unpaid invoices','Post approved receipts','Reconcile daily totals'],'Case Manager':['Review follow-ups due','Record contact outcome','Schedule the next callback'],'Family Liaison':['Verify contact permission','Return approved callbacks','Record disclosure outcome'],Administrator:['Review staff assignments','Check approvals and audit history','Review facility configuration']};
const seed=()=>({beds:['Available','Reserved','Occupied','Cleaning'],admitted:false,handover:false,payment:false,contact:false});
const $=id=>document.getElementById(id), main=$('main');
let state=seed(), tab=0, detail=null;
$('mark').innerHTML=ico('shield',1);
function go(i){tab=i;detail=null;draw();window.scrollTo(0,0)}
function row(title,sub,button='',key=''){return `<div class="row"><div><strong>${title}</strong><p class="muted">${sub}</p></div>${button?`<button class="act" data-do="${key}">${button}</button>`:''}</div>`}
function title(name,sub,k){return `<div class="sectionTitle">${ico(k,tab)}<div><h1>${name}</h1><p class="muted">${sub}</p></div></div>`}
function draw(){
 $('nav').innerHTML=nav.map(([n,k],i)=>`<button data-tab="${i}" ${i===tab?'aria-current="page"':''}>${ico(k,i)}${n}</button>`).join('');
 const role=$('role').value;
 const tiles=[['Available beds',state.beds.filter(x=>x==='Available').length,'bed'],['Handover pending',state.handover?0:1,'shift'],['Invoices to review',state.payment?0:1,'bill'],['Follow-ups due',state.contact?0:1,'chat']];
 const records=state.beds.map((x,i)=>`<div class="card">${ico('bed',i)}<strong>F-0${i+1}</strong><p><span class="pill">${x}</span></p>${x==='Available'?`<button class="act" data-do="reserve-${i}">Reserve</button>`:x==='Cleaning'?`<button class="quiet" data-do="clean-${i}">Mark ready</button>`:''}</div>`).join('');
 const list=Object.keys(tasks).includes(role)?tasks[role]:tasks.Supervisor;
 const photo=role==='Clinician'?portraits.clinician:portraits.nurse;
 const pages=[
 `<section class="hero"><div><h1>${role} workspace</h1><p>Review today’s work, ward availability and items requiring action.</p><span class="pill">Demo data</span></div>${photo?`<img src="${photo}" alt="Illustrative healthcare staff portrait">`:''}</section><div class="grid">${tiles.map(([t,v,k],i)=>`<div class="card">${ico(k,i)}<strong>${v}</strong><small>${t}</small></div>`).join('')}</div><section class="panel"><h2>Role task preview</h2>${list.map((t,i)=>row(t,['Review first','Check record','Confirm next action'][i])).join('')}</section>`,
 title('Admissions','Patient DEMO-014 · Sample intake','user')+`<div class="panel"><h2>Intake checklist</h2>${row('Patient and consent','DEMO-014 · Synthetic intake, consent recorded')}${state.admitted?row('Admission complete','Patient assigned to a female ward bed.'): `<form id="admit" class="form"><label class="label">Bed<select name="bed" required><option value="">Select available bed</option>${state.beds.map((x,i)=>x==='Available'?`<option value="${i}">F-0${i+1}</option>`:'').join('')}</select></label><button class="act">Complete admission</button></form>`}</div>`,
 title('Ward beds','Female ward · Sample occupancy','bed')+`<div class="grid">${records}</div>`,
 title('My shift','Evening shift · Female ward','shift')+`<div class="panel"><h2>Handover</h2>${row('Incoming handover',state.handover?'Acknowledged':'Awaiting acknowledgement',state.handover?'':'Acknowledge','handover')}${row('Care task','Return to the assigned patient work queue.')}</div>`,
 title('Billing','Daily reconciliation · Sample invoice','bill')+`<div class="panel"><h2>Invoice INV-DEMO-01</h2>${row('Stay charge · PKR 12,000',state.payment?'Paid · Receipt R-DEMO-01':'Open balance · PKR 12,000',state.payment?'':'Record sample payment','payment')}</div>`,
 title('Follow-ups','Case management · Synthetic episode','chat')+`<div class="panel"><h2>Aftercare queue</h2>${row('Episode DEMO-014',state.contact?'Attempted · No answer · Callback scheduled':'Contact due today',state.contact?'':'Record no answer','contact')}</div>`,
 title('Screen library','33 screens from the developer guide. Select a screen to review its role and actions.','shield')+`<div class="catalog">${screens.map((s,i)=>`<button data-detail="${i}"><strong>${s[0]}</strong>${s[1]}</button>`).join('')}</div>`];
 main.innerHTML=`<div id="status" role="status" class="notice"></div>`+(detail===null?pages[tab]:preview(detail));
}
function preview(i){const s=screens[i];return title(s[0],s[1]+' · '+s[2],'shield')+`<button class="quiet" data-tab="6">Back to screen library</button><div class="panel"><h2>Expected actions</h2>${s[3].map(([name,body])=>row(name,body)).join('')}</div>`}
function announce(s){$('status').textContent=s}
$('role').onchange=()=>go(0);
$('reset').onclick=()=>{state=seed();go(0);announce('Demo reset.')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab!==undefined)go(Number(b.dataset.tab));
 if(b.dataset.detail!==undefined){detail=Number(b.dataset.detail);draw();window.scrollTo(0,0)}
 const k=b.dataset.do;
 if(!k)return;
 if(k.startsWith('reserve-'))state.beds[Number(k.split('-')[1])]='Reserved';
 else if(k.startsWith('clean-'))state.beds[Number(k.split('-')[1])]='Available';
 else state[k]=true;
 draw();announce('Demo record updated.');
});
document.addEventListener('submit',e=>{if(e.target.id!=='admit')return;e.preventDefault();const val=new FormData(e.target).get('bed');
 if(val!==''&&state.beds[Number(val)]==='Available'){state.beds[Number(val)]='Occupied';state.admitted=true;draw();announce('Demo admission completed.');}
});
draw();
</script></html>
